<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Suit Master - Rock Paper Scissors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="suit.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="sky-background"></div>
    
    <div class="game-container w-full max-w-xl">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold mb-1 tracking-wider" style="font-family: 'Space Mono', monospace;">
                GAME SUIT BOT
            </h1>
            <p class="text-sm opacity-70">Bermain Suit melawan AI • Cepat & Ringan</p>
            <div class="text-xs opacity-60 mt-2">
                <span id="current-time">--:--</span> • <span id="current-greeting">Selamat datang</span>
            </div>
        </div>

        <!-- Score Board -->
        <div class="panel p-4 md:p-6 mb-6 rounded-2xl text-center">
            <div class="grid grid-cols-3 gap-2 items-center">
                <div>
                    <p class="text-xs uppercase tracking-wider opacity-70 mb-1">Anda</p>
                    <p id="player-score" class="text-2xl md:text-3xl font-bold">0</p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-wider opacity-70 mb-1">Status</p>
                    <p id="game-status" class="text-base md:text-xl font-bold text-yellow-400">Siap?</p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-wider opacity-70 mb-1">AI</p>
                    <p id="ai-score" class="text-2xl md:text-3xl font-bold">0</p>
                </div>
            </div>
        </div>

        <!-- Game Area -->
        <div class="panel p-5 md:p-6 rounded-2xl mb-6">
            <p class="text-xs uppercase tracking-wider opacity-70 mb-3 text-center">Pilih Salah Satu</p>
            <div class="grid grid-cols-3 gap-3 mb-4" id="choices-container">
                <button class="choice-btn p-3 md:p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/15 transition-all text-center" data-choice="rock">
                    <span class="text-3xl md:text-4xl block mb-1">✊</span>
                    <span class="text-xs font-medium">Batu</span>
                </button>
                <button class="choice-btn p-3 md:p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/15 transition-all text-center" data-choice="paper">
                    <span class="text-3xl md:text-4xl block mb-1">✋</span>
                    <span class="text-xs font-medium">Kertas</span>
                </button>
                <button class="choice-btn p-3 md:p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/15 transition-all text-center" data-choice="scissors">
                    <span class="text-3xl md:text-4xl block mb-1">✌️</span>
                    <span class="text-xs font-medium">Gunting</span>
                </button>
            </div>

            <!-- Result Display -->
            <div id="result-area" class="hidden mt-4 pt-4 border-t border-white/10 text-center">
                <div class="grid grid-cols-3 gap-2 items-center mb-4">
                    <div>
                        <p class="text-2xl md:text-3xl mb-1" id="player-emoji">✊</p>
                        <p class="text-xs opacity-70" id="player-choice-name">Batu</p>
                    </div>
                    <div class="text-lg font-bold opacity-50">VS</div>
                    <div>
                        <p class="text-2xl md:text-3xl mb-1" id="ai-emoji">✊</p>
                        <p class="text-xs opacity-70" id="ai-choice-name">Batu</p>
                    </div>
                </div>
                
                <button id="play-again-btn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl font-semibold text-sm transition-all shadow-md">
                    Main Lagi
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-xs opacity-50">
            <p>Dibuat oleh Ramadhan Syahnendi</p>
        </div>
    </div>

    <script src="suit.js"></script>
</body>
</html>
